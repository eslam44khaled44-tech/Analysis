<!DOCTYPE html>

<html lang="en">

<head> <meta charset="UTF-8"> <meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Student Grades Analysis</title>

<link rel="stylesheet" href="asmaa.css">


</head>

<body>

<div class="bubbles">
    <span></span>
    <span></span>
    <span></span>
    <span></span>
    <span></span>
    <span></span>
    <span></span>
    <span></span>
</div>

<div class="container">

    <header>
        <h1>Student Grades Analysis</h1>
        <p>Welcome to Student Management System</p>
    </header>

    <div class="form-card">

        <h2>Enter Student Information</h2>

        <div class="input-group">
            <label>Student ID</label>
            <input type="number" id="studentId" placeholder="Enter Student ID">
        </div>

        <div class="input-group">
            <label>Student Name</label>
            <input type="text" id="studentName" placeholder="Enter Student Name">
        </div>

        <div class="input-group">
            <label>Programming Grade</label>
            <input type="number" id="grade1" placeholder="Enter Programming Grade">
        </div>

        <div class="input-group">
            <label>JavaScript Grade</label>
            <input type="number" id="grade2" placeholder="Enter JavaScript Grade">
        </div>

        <div class="input-group">
            <label>HTML & CSS Grade</label>
            <input type="number" id="grade3" placeholder="Enter HTML & CSS Grade">
        </div>

        <div class="input-group">
            <label>Attendance Percentage</label>
            <input type="number" id="attendance" placeholder="Enter Attendance %">
        </div>

        <button onclick="addStudent()">Calculate Result</button>

    </div>

    <div class="results-section">

        <h2>Students Results</h2>

        <div id="resultsContainer"></div>

    </div>

</div>

<script src="asmaa.js"></script>


</body> </html>
